# Bundle patch for @local/web-search-exa: register the Exa MCP-backed
# web search provider. Select it with the `web` row's searchProvider: exa
# (kept in the profile's user patch layer, because a matching override
# replaces the complete row config).
- insert:
    - id: web-search-exa
      name: '@local/web-search-exa'
      config:
        url: https://mcp.exa.ai/mcp
        toolName: web_search_exa
        numResults: 10
        timeoutMs: 45000
